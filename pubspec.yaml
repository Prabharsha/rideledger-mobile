name: ride_ledger
description: TW200 Break-In Assistant + Fuel Quota Manager
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0

  # Navigation
  go_router: ^17.1.0

  # Local persistence
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1

  # Location
  geolocator: ^14.0.2
  permission_handler: ^12.0.1

  # Maps
  flutter_map: ^8.2.2
  latlong2: ^0.9.1

  # Voice
  flutter_tts: ^4.2.5

  # Charts
  fl_chart: ^1.2.0

  # Export
  csv: ^8.0.0
  pdf: ^3.10.7
  path_provider: ^2.1.1
  share_plus: ^12.0.1

  # Notifications
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.0.0
  wakelock_plus: ^1.2.0
  shared_preferences: ^2.3.2
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.6
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  # Assets will be uncommented when files are added
  # assets:
  #   - assets/images/
  #   - assets/icons/
